{% extends 'mailing/base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Восстановление пароля</h2>
    <p>Введите email, указанный при регистрации.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">
            Отправить письмо
        </button>
    </form>
</div>
{% endblock %}
