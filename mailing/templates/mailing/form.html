{% extends 'mailing/base.html' %}

{% block title %}{{ form_title }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-body">
            <h2>{{ form_title }}</h2>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.non_field_errors }}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">{{ submit_text|default:"Сохранить" }}</button>
                <a href="{{ cancel_url }}" class="btn btn-secondary">Отменить</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
