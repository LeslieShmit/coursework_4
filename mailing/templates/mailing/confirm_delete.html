{% extends 'mailing/base.html' %}

{% block title %}Подтверждение удаления{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card text-center">
        <div class="card-body">
            <h3 class="card-title">Вы действительно хотите удалить {{ object_name }}?</h3>
            {% if object_description %}
            <p class="card-text">{{ object_description }}</p>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Удалить</button>
                <a href="{{ cancel_url }}" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
